<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>chatroom</title><link rel="stylesheet" href="styles.css"></head><body><main class="app"><header><div class="brand"><span class="dot"></span><div><strong>chatroom</strong><small>everyone is here</small></div></div><button id="loginButton" class="login">SIGN IN</button></header><section class="conversation"><div class="conversation-title"><div><h1>the group chat</h1><p><span class="online-dot"></span>shared chat</p></div><span class="lock">⌁</span></div><div class="messages" id="messages"><div class="notice">Messages are visible to everyone in this chat.</div></div><form class="composer" id="composer"><input id="messageInput" placeholder="Message everyone..." autocomplete="off"><button type="submit">↑</button></form><div class="hint">Press Enter to send</div></section><footer><span>simple chat · just conversation</span><span>you control your username</span></footer></main><dialog id="loginDialog"><button class="close" id="closeDialog">×</button><h2>Join the chat</h2><p>Choose a username to start chatting with everyone.</p><form id="loginForm"><label>USERNAME<input id="username" required minlength="2" maxlength="20" placeholder="your username" autocomplete="off"></label><button class="join" type="submit">ENTER CHAT</button></form></dialog><script src="app.js"></script></body></html>
